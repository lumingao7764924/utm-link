<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UTM Link Builder</title>
<script>
  (function () {
    var MANUAL_KEY = "utm-link-lang-manual";
    var saved = localStorage.getItem(MANUAL_KEY);
    var lang;
    if (saved === "zh" || saved === "en") {
      lang = saved;
    } else {
      var list = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];
      var primary = String(list[0] || "en").toLowerCase();
      lang = primary.indexOf("zh") === 0 ? "zh" : "en";
    }
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.documentElement.dataset.lang = lang;
  })();
</script>
<style>
  :root {
    --bg: #eef2f6;
    --card: #ffffff;
    --ink: #1a2332;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --accent: #1e4d7b;
    --accent-soft: rgba(30, 77, 123, 0.1);
    --ok: #0f766e;
    --warn: #b45309;
    --field: #ffffff;
    --field-soft: #f8fafc;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1000px 420px at 8% -8%, #dbeafe 0%, transparent 55%),
      radial-gradient(800px 360px at 100% 0%, #ccfbf1 0%, transparent 48%),
      var(--bg);
    min-height: 100vh;
    padding: 36px 16px 56px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 {
    margin: 0 0 8px;
    font-size: 1.7rem;
    letter-spacing: -0.03em;
    color: var(--accent);
  }
  .sub {
    color: var(--muted);
    margin: 0 0 24px;
    line-height: 1.55;
    font-size: 0.95rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 28px;
    box-shadow: var(--shadow);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    .card { padding: 20px; }
  }
  .field { min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #334155;
    letter-spacing: 0.01em;
  }
  .hint { font-weight: 400; color: var(--muted); }

  /* 统一控件：select / input 同一外观 */
  .control {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0 14px;
    font: inherit;
    font-size: 0.92rem;
    background: var(--field);
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  select.control {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    padding-right: 40px;
    background-color: var(--field);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }
  .control:hover {
    border-color: var(--line-strong);
  }
  .control:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background-color: #fff;
  }
  .control::placeholder { color: #94a3b8; }
  .control.invalid {
    border-color: #f59e0b;
    box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.12);
  }
  .control.invalid:focus {
    border-color: var(--warn);
    box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.18);
  }
  .field-error {
    margin-top: 6px;
    font-size: 0.82rem;
    color: var(--warn);
    min-height: 1.2em;
  }
  .field-error:empty { display: none; }

  .rules {
    margin: 20px 0 0;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: var(--field-soft);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.86rem;
    line-height: 1.55;
  }
  .rules code {
    background: #eef2f7;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.85em;
    color: #475569;
  }

  .out {
    margin-top: 24px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  .out h2 {
    margin: 0 0 14px;
    font-size: 1rem;
    color: var(--accent);
  }

  /* 统一结果行 + 复制按钮 */
  .result-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    display: grid;
    grid-template-columns: 148px 1fr 96px;
    gap: 12px;
    align-items: stretch;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--field-soft);
    transition: border-color .15s, box-shadow .15s;
  }
  .row:hover {
    border-color: var(--line-strong);
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }
  .row.highlight {
    background: linear-gradient(135deg, #f0fdfa 0%, #f8fafc 100%);
    border-color: #99f6e4;
  }
  @media (max-width: 700px) {
    .row { grid-template-columns: 1fr; }
  }
  .key {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.84rem;
    font-weight: 600;
    color: #475569;
    padding: 0 2px;
  }
  .key::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .row.highlight .key { color: #0f766e; }
  .row.highlight .key::before { background: var(--ok); }

  .val {
    display: flex;
    align-items: center;
    min-height: 42px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.86rem;
    line-height: 1.45;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    word-break: break-all;
    color: var(--ink);
  }
  .row.highlight .val {
    border-color: #99f6e4;
    color: #115e59;
  }

  .btn-copy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 42px;
    min-width: 96px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 0 12px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
  }
  .btn-copy svg {
    width: 14px;
    height: 14px;
    flex: none;
  }
  .btn-copy:hover {
    background: #163a5c;
    border-color: #163a5c;
    box-shadow: 0 4px 12px rgba(30, 77, 123, 0.22);
  }
  .btn-copy:active { transform: translateY(1px); }
  .btn-copy:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }
  .row.highlight .btn-copy {
    background: var(--ok);
    border-color: var(--ok);
  }
  .row.highlight .btn-copy:hover {
    background: #0d5c56;
    border-color: #0d5c56;
    box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    min-height: 1.4em;
  }
  .btn-reset {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: #fff;
    color: #475569;
    font: inherit;
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn-reset:hover {
    background: var(--field-soft);
    border-color: #94a3b8;
    color: var(--ink);
  }
  .btn-reset:active { transform: translateY(1px); }
  .status {
    font-size: 0.9rem;
    flex: 1;
    min-height: 1.4em;
  }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: #0f172a;
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 4px;
  }
  .topbar > div { min-width: 0; }
  .lang-switch {
    display: inline-flex;
    flex: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .lang-switch button:hover { color: var(--ink); }
  .lang-switch button.active {
    background: var(--accent);
    color: #fff;
  }
  @media (max-width: 700px) {
    .topbar {
      flex-direction: column;
      align-items: stretch;
    }
    .lang-switch { align-self: flex-end; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 data-i18n="title">UTM 自动生成器</h1>
        <p class="sub" data-i18n="subtitle">输入落地页链接，选择渠道后填写系列/素材名，即时生成合规 UTM 链接。不写进姓名、邮箱等个人信息。</p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" id="langZh" data-lang="zh">中文</button>
        <button type="button" id="langEn" data-lang="en">EN</button>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="field full">
          <label for="base"><span data-i18n="labelBase">前缀链接</span> <span class="hint" data-i18n="hintBase">（落地页 URL）</span></label>
          <input class="control" id="base" type="text" inputmode="url" data-i18n-placeholder="placeholderBase" placeholder="例如 https://example.com/product 或已带参数的链接" value="" autocomplete="url" spellcheck="false" />
          <div class="field-error" id="baseError"></div>
        </div>

        <div class="field">
          <label for="source">utm_source <span class="hint" data-i18n="hintSource">（平台）</span></label>
          <select class="control" id="source"></select>
        </div>

        <div class="field">
          <label for="medium">utm_medium <span class="hint" data-i18n="hintMedium">（投放方式）</span></label>
          <select class="control" id="medium"></select>
        </div>

        <div class="field">
          <label for="campaign">utm_campaign <span class="hint" data-i18n="hintCampaign">（广告系列名）</span></label>
          <input class="control" id="campaign" type="text" data-i18n-placeholder="placeholderCampaign" placeholder="例如 midyear-sale_lip-serum" value="" />
        </div>

        <div class="field">
          <label for="content">utm_content <span class="hint" data-i18n="hintContent">（素材名，可选）</span></label>
          <input class="control" id="content" type="text" data-i18n-placeholder="placeholderContent" placeholder="例如 video-ugc_v1" value="" />
        </div>
      </div>

      <div class="rules" data-i18n-html="rules">
        规则：小写英文 · 单词用 <code>-</code> · 层级用 <code>_</code> · 不要空格/中文/特殊符号
      </div>

      <div class="out">
        <h2 data-i18n="resultTitle">生成结果</h2>
        <div class="result-list">
          <div class="row">
            <div class="key" data-i18n="keyCampaign">标准化 campaign</div>
            <div class="val" id="campOut">-</div>
            <button class="btn-copy" type="button" data-copy="campOut">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
              <span data-i18n="copy">复制</span>
            </button>
          </div>
          <div class="row">
            <div class="key" data-i18n="keyContent">标准化 content</div>
            <div class="val" id="contOut">-</div>
            <button class="btn-copy" type="button" data-copy="contOut">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
              <span data-i18n="copy">复制</span>
            </button>
          </div>
          <div class="row highlight">
            <div class="key" data-i18n="keyUrl">完整 UTM 链接</div>
            <div class="val" id="urlOut">-</div>
            <button class="btn-copy" type="button" data-copy="urlOut">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
              <span data-i18n="copy">复制</span>
            </button>
          </div>
        </div>
        <div class="actions">
          <button class="btn-reset" type="button" id="resetBtn" data-i18n="reset">重置</button>
          <div class="status" id="status"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" data-i18n="copied">已复制</div>

  <script>
    const LANG_KEY = "utm-link-lang-manual";

    const I18N = {
      zh: {
        pageTitle: "UTM 自动生成器",
        title: "UTM 自动生成器",
        subtitle: "输入落地页链接，选择渠道后填写系列/素材名，即时生成合规 UTM 链接。不写进姓名、邮箱等个人信息。",
        labelBase: "前缀链接",
        hintBase: "（落地页 URL）",
        placeholderBase: "例如 https://example.com/product 或已带参数的链接",
        hintSource: "（平台）",
        hintMedium: "（投放方式）",
        hintCampaign: "（广告系列名）",
        hintContent: "（素材名，可选）",
        placeholderCampaign: "例如 midyear-sale_lip-serum",
        placeholderContent: "例如 video-ugc_v1",
        selectSource: "请选择平台",
        selectMedium: "请选择投放方式",
        rules: "规则：小写英文 · 单词用 <code>-</code> · 层级用 <code>_</code> · 不要空格/中文/特殊符号",
        resultTitle: "生成结果",
        keyCampaign: "标准化 campaign",
        keyContent: "标准化 content",
        keyUrl: "完整 UTM 链接",
        copy: "复制",
        reset: "重置",
        copied: "已复制",
        copyFailed: "复制失败，请手动复制：",
        campEmpty: "（请填写 campaign）",
        contEmpty: "（可选）",
        baseInvalid: "请输入有效的链接（需含域名，如 https://example.com/path）",
        urlInvalid: "前缀链接格式不正确",
        fixBase: "请修正前缀链接后再生成",
        fillRequired: "请先完成必填项",
        missingPrefix: "缺少：",
        comboWarn: "⚠ 请检查 source / medium 搭配（例如 facebook 搭配 paid_social，google 搜索用 cpc）",
        comboOk: "✓ 搭配正常",
        fieldBase: "前缀链接",
        fieldSource: "平台",
        fieldMedium: "投放方式",
        fieldCampaign: "utm_campaign",
      },
      en: {
        pageTitle: "UTM Link Builder",
        title: "UTM Link Builder",
        subtitle: "Enter a landing page URL, pick a channel, and name your campaign/creative to generate compliant UTM links. No personal info (name, email, etc.).",
        labelBase: "Base URL",
        hintBase: "(landing page)",
        placeholderBase: "e.g. https://example.com/product or a URL with existing params",
        hintSource: "(platform)",
        hintMedium: "(placement type)",
        hintCampaign: "(campaign name)",
        hintContent: "(creative name, optional)",
        placeholderCampaign: "e.g. midyear-sale_lip-serum",
        placeholderContent: "e.g. video-ugc_v1",
        selectSource: "Select platform",
        selectMedium: "Select placement",
        rules: "Rules: lowercase · words joined with <code>-</code> · levels with <code>_</code> · no spaces/CJK/special chars",
        resultTitle: "Generated output",
        keyCampaign: "Normalized campaign",
        keyContent: "Normalized content",
        keyUrl: "Full UTM link",
        copy: "Copy",
        reset: "Reset",
        copied: "Copied",
        copyFailed: "Copy failed — copy manually:",
        campEmpty: "(enter campaign)",
        contEmpty: "(optional)",
        baseInvalid: "Enter a valid URL with a domain (e.g. https://example.com/path)",
        urlInvalid: "Invalid base URL",
        fixBase: "Fix the base URL to generate",
        fillRequired: "Complete required fields first",
        missingPrefix: "Missing: ",
        comboWarn: "⚠ Check source / medium pairing (e.g. facebook + paid_social, google search + cpc)",
        comboOk: "✓ Pairing looks good",
        fieldBase: "base URL",
        fieldSource: "platform",
        fieldMedium: "placement",
        fieldCampaign: "utm_campaign",
      },
    };

    let currentLang = document.documentElement.dataset.lang || "en";

    function detectBrowserLang() {
      const list = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || "en"];
      const primary = String(list[0] || "en").toLowerCase();
      return primary.startsWith("zh") ? "zh" : "en";
    }

    function getInitialLang() {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "zh" || saved === "en") return saved;
      return detectBrowserLang();
    }

    function t(key) {
      return I18N[currentLang][key] ?? I18N.en[key] ?? key;
    }

    function applyLang(lang, { persist = false } = {}) {
      currentLang = lang;
      if (persist) {
        localStorage.setItem(LANG_KEY, lang);
      }
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.documentElement.dataset.lang = lang;
      document.title = t("pageTitle");

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        el.innerHTML = t(el.dataset.i18nHtml);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
      });

      document.getElementById("langZh").classList.toggle("active", lang === "zh");
      document.getElementById("langEn").classList.toggle("active", lang === "en");

      renderOptions();
      update();
    }

    // 以后增删选项只需改这个对象
    const OPTIONS = {
      source: [
        "google",
        "facebook",
        "instagram",
        "tiktok",
        "snapchat",
        "omnisend",
        "youtube",
      ],
      medium: [
        "cpc",
        "display",
        "paid_social",
        "email",
        "organic_social",
        "affiliate",
        "sms",
        "kol",
      ],
      // source -> 可用的 medium
      sourceMediumMap: {
        google: ["cpc", "display", "organic_social", "affiliate", "sms"],
        facebook: ["paid_social", "organic_social", "affiliate", "sms"],
        instagram: ["paid_social", "organic_social", "affiliate", "sms"],
        tiktok: ["paid_social", "organic_social", "affiliate", "sms"],
        snapchat: ["paid_social", "organic_social", "affiliate", "sms"],
        omnisend: ["email", "sms"],
        youtube: ["organic_social", "affiliate", "sms", "paid_social"],
      },
    };

    const $ = (id) => document.getElementById(id);

    function fillSelect(selectEl, list, placeholder) {
      selectEl.innerHTML = "";
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = placeholder;
      selectEl.appendChild(empty);
      list.forEach((item) => {
        const opt = document.createElement("option");
        opt.value = item;
        opt.textContent = item;
        selectEl.appendChild(opt);
      });
      selectEl.value = "";
    }

    function renderOptions() {
      const sourceVal = $("source").value;
      const mediumVal = $("medium").value;
      fillSelect($("source"), OPTIONS.source, t("selectSource"));
      fillSelect($("medium"), OPTIONS.medium, t("selectMedium"));
      if (OPTIONS.source.includes(sourceVal)) $("source").value = sourceVal;
      if (OPTIONS.medium.includes(mediumVal)) $("medium").value = mediumVal;
    }

    function sanitize(raw) {
      return String(raw || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9\s_-]/g, "")
        .replace(/[\s]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^[-_]+|[-_]+$/g, "");
    }

    function comboOk(source, medium) {
      return (OPTIONS.sourceMediumMap[source] || []).includes(medium);
    }

    /** 校验并规范化前缀链接；成功返回规范化 URL，失败返回 null */
    function parseBaseUrl(raw) {
      const trimmed = String(raw || "").trim();
      if (!trimmed) return { ok: false, reason: "empty" };

      let candidate = trimmed;
      if (!/^https?:\/\//i.test(candidate)) {
        candidate = "https://" + candidate;
      }

      let parsed;
      try {
        parsed = new URL(candidate);
      } catch (e) {
        return { ok: false, reason: "invalid" };
      }

      if (!/^https?:$/i.test(parsed.protocol)) {
        return { ok: false, reason: "invalid" };
      }
      if (!parsed.hostname || !parsed.hostname.includes(".")) {
        return { ok: false, reason: "invalid" };
      }

      return { ok: true, href: parsed.href };
    }

    function joinUtm(baseHref, query) {
      const clean = baseHref.replace(/[?&]+$/, "");
      const sep = clean.includes("?") ? "&" : "?";
      return clean + sep + query;
    }

    function update() {
      const baseRaw = $("base").value;
      const baseResult = parseBaseUrl(baseRaw);
      const source = $("source").value;
      const medium = $("medium").value;
      const camp = sanitize($("campaign").value);
      const cont = sanitize($("content").value);

      const baseEl = $("base");
      const baseError = $("baseError");
      if (!baseRaw.trim()) {
        baseEl.classList.remove("invalid");
        baseError.textContent = "";
      } else if (!baseResult.ok) {
        baseEl.classList.add("invalid");
        baseError.textContent = t("baseInvalid");
      } else {
        baseEl.classList.remove("invalid");
        baseError.textContent = "";
      }

      $("campOut").textContent = camp || t("campEmpty");
      $("contOut").textContent = cont || t("contEmpty");

      const status = $("status");
      const missing = [];
      if (!baseRaw.trim()) missing.push(t("fieldBase"));
      if (!source) missing.push(t("fieldSource"));
      if (!medium) missing.push(t("fieldMedium"));
      if (!camp) missing.push(t("fieldCampaign"));

      if (baseRaw.trim() && !baseResult.ok) {
        $("urlOut").textContent = t("urlInvalid");
        status.className = "status warn";
        status.textContent = t("fixBase");
        return;
      }

      if (missing.length) {
        $("urlOut").textContent = t("fillRequired");
        status.className = "status warn";
        status.textContent = t("missingPrefix") + missing.join(currentLang === "zh" ? "、" : ", ");
        return;
      }

      if (!comboOk(source, medium)) {
        status.className = "status warn";
        status.textContent = t("comboWarn");
      } else {
        status.className = "status ok";
        status.textContent = t("comboOk");
      }

      const utmQuery =
        `utm_source=${encodeURIComponent(source)}` +
        `&utm_medium=${encodeURIComponent(medium)}` +
        `&utm_campaign=${encodeURIComponent(camp)}` +
        (cont ? `&utm_content=${encodeURIComponent(cont)}` : "");

      $("urlOut").textContent = joinUtm(baseResult.href, utmQuery);
    }

    function resetForm() {
      $("base").value = "";
      $("source").value = "";
      $("medium").value = "";
      $("campaign").value = "";
      $("content").value = "";
      update();
    }

    document.querySelectorAll(".lang-switch [data-lang]").forEach((btn) => {
      btn.addEventListener("click", () => applyLang(btn.dataset.lang, { persist: true }));
    });

    ["base", "source", "medium", "campaign", "content"].forEach((id) => {
      $(id).addEventListener("input", update);
      $(id).addEventListener("change", update);
    });

    $("resetBtn").addEventListener("click", resetForm);

    document.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const text = $(btn.dataset.copy).textContent;
        const nonCopyable = new Set([
          t("campEmpty"), t("contEmpty"), t("fillRequired"), t("urlInvalid"), "-",
          I18N.zh.campEmpty, I18N.en.campEmpty,
          I18N.zh.contEmpty, I18N.en.contEmpty,
          I18N.zh.fillRequired, I18N.en.fillRequired,
          I18N.zh.urlInvalid, I18N.en.urlInvalid,
        ]);
        if (!text || nonCopyable.has(text)) return;
        try {
          await navigator.clipboard.writeText(text);
          const toast = $("toast");
          toast.textContent = t("copied");
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 1200);
        } catch (e) {
          prompt(t("copyFailed"), text);
        }
      });
    });

    applyLang(getInitialLang());
  </script>
</body>
</html>
